# Production nginx config for www.jameryw.dev (VPS: jwip / 142.93.21.26).
# Source of truth for the server's /etc/nginx/nginx.conf — apply with: npm run deploy:nginx
# TLS: Let's Encrypt via acme.sh DNS-01 (Aliyun), SAN *.jameryw.dev + jameryw.dev,
#      certs under /root/.acme.sh/jameryw.dev_ecc/ and renewed by cron.
# /ws and /xray reverse-proxy this box's own services — keep them when editing.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
        multi_accept on;
	use epoll;
}

http {
    # 隐私：不再记录 User-Agent（设备指纹），只保留最小审计字段
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent';

    access_log  /var/log/nginx/access.log  main;
    error_log /var/log/nginx/error.log;

    server_tokens       off;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    include /etc/nginx/conf.d/*.conf;

    # Compression for text assets (woff2 is already compressed; excluded).
    gzip                on;
    gzip_vary           on;
    gzip_comp_level     5;
    gzip_min_length     1024;
    gzip_proxied        any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # Baseline response hardening (CSP itself lives in each page's <meta>).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Plain HTTP: no site content, only the canonical redirect.
    server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	return 301 https://www.jameryw.dev$request_uri;
    }

    # Canonical site: https://www.jameryw.dev
    server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name www.jameryw.dev;

        index index.html;
        root /var/www/html;

        ssl_certificate     /root/.acme.sh/jameryw.dev_ecc/fullchain.cer;
        ssl_certificate_key /root/.acme.sh/jameryw.dev_ecc/jameryw.dev.key;

        ssl_protocols TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        client_header_timeout 5m;
        keepalive_timeout 5m;

        charset utf-8;

        # Custom 404 page (site ships public/404.html for direct hits too).
        error_page 404 /404.html;

	location / {
            try_files $uri $uri/ =404;
        }

        # HTML shell: always revalidate so SW/network-first deploys land fast.
        location ~* \.html$ {
            expires -1;
            try_files $uri =404;
        }

        location = /notfound.js {
            expires -1;
        }

        location = /umami-config.js {
            expires -1;
        }

        # The SW script must always be revalidated so new cache versions land.
        location = /sw.js {
            expires -1;
        }

        # Versioned statics (?v=) are immutable by convention; fonts carry
        # their version in the filename. Cache aggressively; bump ?v= to ship.
        location ~* \.(?:css|js|woff2)$ {
            expires 1y;
            try_files $uri =404;
        }

        location ~* \.(?:png|svg|ico)$ {
            expires 30d;
            try_files $uri =404;
        }

        # Error document is internal-only: /404.html itself stays a 404.
        location = /404.html {
            internal;
            expires -1;
        }

        location /ws {
            access_log off;
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
        }

	location /xray {
            access_log off;
            client_max_body_size 0;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_body_timeout 5m;
            grpc_read_timeout 315;
            grpc_send_timeout 5m;
            grpc_pass unix:/dev/shm/xrxh.socket;
        }
    }

    # Apex: canonical redirect to www, but keep the WS/gRPC proxy paths
    # reachable for existing clients that connect through jameryw.dev.
    server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name jameryw.dev;

        ssl_certificate     /root/.acme.sh/jameryw.dev_ecc/fullchain.cer;
        ssl_certificate_key /root/.acme.sh/jameryw.dev_ecc/jameryw.dev.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        charset utf-8;

        location /ws {
            access_log off;
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
        }

	location /xray {
            access_log off;
            client_max_body_size 0;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_body_timeout 5m;
            grpc_read_timeout 315;
            grpc_send_timeout 5m;
            grpc_pass unix:/dev/shm/xrxh.socket;
        }

        location / {
            return 301 https://www.jameryw.dev$request_uri;
        }
    }

}
